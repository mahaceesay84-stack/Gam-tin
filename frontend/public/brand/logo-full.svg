<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#ffffff"/>
  <!-- badge ring -->
  <circle cx="400" cy="360" r="290" fill="#ffffff" stroke="#1E2A6E" stroke-width="24"/>
  <!-- open book, solid -->
  <path d="M 400,275 C 335,242 262,242 205,262 V 462 C 262,442 335,442 400,475 C 465,442 538,442 595,462 V 262 C 538,242 465,242 400,275 Z" fill="#1E2A6E"/>
  <!-- page lines -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <path d="M 245,320 C 290,306 335,306 370,318"/>
    <path d="M 245,370 C 290,356 335,356 370,368"/>
    <path d="M 430,318 C 465,306 510,306 555,320"/>
    <path d="M 430,368 C 465,356 510,356 555,370"/>
  </g>
  <!-- clearance check as negative space over the spine -->
  <path d="M 315,395 l 45,45 l 85,-100" fill="none" stroke="#ffffff" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 315,395 l 45,45 l 85,-100" fill="none" stroke="#007A3D" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wordmark -->
  <text x="400" y="735" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="4" fill="#1E2A6E">UTG DIGITAL</text>
  <text x="400" y="775" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="8" fill="#475569">STUDENT SERVICES</text>
</svg>
